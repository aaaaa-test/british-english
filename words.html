<title>5000 British Words</title>
<meta name="apple-mobile-web-app-title" content="Words">
<style>
/* Layout: a one-hand phone app. One column of black word cards in the learner's own slide colours
   (pink word, teal meaning, pale cyan example), with the tab bar under the thumb. Light by default; dark can be chosen in Me. */
:root{
  color-scheme: dark;
  --ink:#000000;
  --panel:#0a1012;
  --panel-2:#111a1d;
  --line:#21313a;
  --word:#ff80d5;
  --def:#19b5ae;
  --ex:#b8fff4;
  --text:#e8f3f2;
  --muted:#93aaa8;
  --good:#7fe0a0;
  --bad:#ff9183;
  --gold:#ffd36e;
  --f-read:"Andika","Trebuchet MS",system-ui,sans-serif;
  --f-ui:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabh:62px;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
html.locked,html.locked body{overflow:hidden}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
#view{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 32px);display:grid;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(0,0,0,.94);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab{appearance:none;background:none;border:0;color:var(--muted);font:500 12px/1 var(--f-ui);letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:var(--tabh);cursor:pointer}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--word)}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:600 16px/1.2 var(--f-ui);border-radius:14px;padding:12px 16px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-align:center}
.btn.primary{background:var(--word);border-color:var(--word);color:#22001a}
.btn.big{width:100%;font-size:18px;min-height:58px}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--ex);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 140px}
.eyebrow{font:600 12px/1.2 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.hello{display:grid;gap:4px;padding-top:6px}
.hello h1{font:600 26px/1.15 var(--f-ui);margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px;min-width:0}
.goal{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:600 26px/1 var(--f-ui)}
.ring .t small{display:block;font:500 11px/1.3 var(--f-ui);color:var(--muted);margin-top:4px;letter-spacing:.04em}
.stats{display:grid;gap:8px}
.stat{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.stat:last-child{border-bottom:0;padding-bottom:0}
.stat b{font-weight:600}
.pbar{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--word);border-radius:99px}
.pbar.teal>i{background:var(--def)}
.card{background:var(--ink);border:1px solid var(--line);border-radius:22px;padding:22px 18px 24px;display:grid;gap:16px;min-width:0}
.card .emo{font-size:72px;line-height:1.05;text-align:center}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.hw{font:400 clamp(40px,12vw,62px)/1.08 var(--f-read);color:var(--word);margin:0;overflow-wrap:anywhere;min-width:0}
.hw.sm{font-size:clamp(32px,9vw,44px)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;letter-spacing:.04em}
.line{display:flex;align-items:flex-start;gap:12px;min-width:0}
.line p{margin:0;flex:1;min-width:0;font-family:var(--f-read);font-size:21px;line-height:1.4}
.def p{color:var(--def)}
.ex p{color:var(--ex)}
.tgt{color:var(--word)}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools .btn{flex:1 1 120px}
.star.on{color:var(--gold);border-color:var(--gold)}
.star.on svg{fill:var(--gold);stroke:var(--gold)}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;min-width:0}

.item .w{font:400 21px/1.2 var(--f-read);color:var(--word);overflow-wrap:anywhere}

.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}

.levels{display:grid;gap:10px}

.lvl h3{margin:0;font:600 18px/1.2 var(--f-ui)}

.lvl.off{opacity:.5;cursor:default}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pack{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:grid;gap:6px;text-align:left;cursor:pointer}

.pack span{font-size:12px;color:var(--muted)}

.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);padding-block:8px 6px}

/* add to home screen (website copies) */
.instbar{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.instgo{flex:1;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:12px 14px;cursor:pointer;min-width:0}
.instgo b{display:block;font:600 16px/1.25 var(--f-ui)}
.instgo .muted{display:block;font-size:14px;margin-top:2px}
.instx{background:none;border:0;border-left:1px solid var(--line);color:var(--muted);width:52px;display:grid;place-items:center;cursor:pointer;flex:none}

.insthelp{display:grid;gap:16px;max-width:520px;margin:0 auto;width:100%}
.isteps{list-style:none;margin:0;padding:0;display:grid;gap:12px}

.istep .n{width:32px;height:32px;border-radius:50%;background:var(--word);color:#000;display:grid;place-items:center;font:700 16px/1 var(--f-ui);flex:none}
.istep b{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font:600 17px/1.3 var(--f-ui)}
.istep p{margin:6px 0 0;font-size:15px;line-height:1.45}
.ic{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--def)}
.ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* light background, chosen in Me (kept on this device) */
html.light{color-scheme:light;--ink:#ffffff;--panel:#f4f7f7;--panel-2:#e9eff0;--line:#d3dee1;--word:#c0157a;--def:#0a7c76;--ex:#1f4f4b;--text:#132322;--muted:#5c6f6d;--good:#1f7a46;--bad:#c0392b;--gold:#8a6400}

html.light .btn.teal,html.light .seg button[aria-pressed="true"]{background:#19b5ae;border-color:#19b5ae;color:#001c1a}

html.light .istep .n{background:#ff80d5}
html.light .nbrow.on .tick{background:#19b5ae;border-color:#19b5ae}

html.light .box.gb{border-color:#e3d29a}
html.light .tline .wt{border-color:#f2bddf}
/* notebooks */
.nbwrap{display:grid;gap:14px;max-width:520px;margin:0 auto;width:100%}
.nblist{display:grid;gap:10px}
.nbrow{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 14px 8px}
.nbrow.on{border-color:var(--def)}
.nbpick{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--text);font:600 17px/1.3 var(--f-ui);padding:10px 0;text-align:left;cursor:pointer;min-height:48px}
.nbpick .tick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:15px;line-height:1;color:#000;flex:none}
.nbrow.on .tick{background:var(--def);border-color:var(--def)}
.nbpick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbpick .tag{font:600 12px/1 var(--f-ui);color:var(--def);text-transform:uppercase;letter-spacing:.08em;flex:none}
.nbacts{display:flex;gap:20px;padding-left:38px}
.nbedit{display:grid;gap:8px;padding:10px 0 4px}
.nbnew{display:grid;gap:8px;background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:14px}
.nbnew label{font:600 14px/1.2 var(--f-ui);color:var(--muted)}
.nbnew .btn{margin-top:6px}
.nbrow .confirm{margin:10px 0 4px}
.nbline{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid var(--line);border-radius:14px;color:var(--muted);font:500 15px/1.3 var(--f-ui);padding:10px 14px;cursor:pointer;text-align:left;min-height:44px}
.nbline b{color:var(--text);font-weight:600}
.nbline svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nbline .chev{margin-left:auto;font-size:22px;line-height:1}
/* accounts (website copies) */
.acct .big1{font:600 18px/1.25 var(--f-ui)}
.who{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);font:600 18px/1 var(--f-ui);color:var(--text);flex:none}
.av svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who .nm{display:block;font:600 18px/1.25 var(--f-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--text);font:inherit;cursor:pointer}
.acctbar b{display:block;font:600 16px/1.25 var(--f-ui)}
.acctbar .muted{display:block;font-size:14px;margin-top:2px}
.acctbar .chev{margin-left:auto;color:var(--muted);font-size:24px;line-height:1}
.signedin{margin:0;font-size:14px}
.signedin b{color:var(--text);font-weight:600}
.acctwrap{display:grid;gap:14px;max-width:480px;margin:0 auto;width:100%}
.accth{font:600 24px/1.2 var(--f-ui);margin:6px 0 0}
.acctform{display:grid;gap:6px}
.acctform label{font:600 14px/1.2 var(--f-ui);color:var(--muted);margin-top:10px}
.field{width:100%;box-sizing:border-box;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;color:var(--text);font:400 18px/1.3 var(--f-ui);padding:13px 14px;min-height:52px}
.field:focus{outline:none;border-color:var(--def)}
.formmsg{margin:10px 0 0;color:var(--bad);font-size:15px;line-height:1.4}

.acctform .btn{margin-top:14px}
.acctlinks{display:flex;flex-wrap:wrap;gap:0 20px}
.linkbtn{background:none;border:0;color:var(--def);font:500 15px/1.3 var(--f-ui);padding:10px 0;min-height:44px;cursor:pointer;text-align:left}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font:500 15px/1 var(--f-ui);padding:6px 12px 6px 0;min-height:44px;text-decoration:none;cursor:pointer}
.back svg,.x svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;width:100%}
.mode .ic{width:44px;height:44px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;font-size:24px}
.mode b{display:block;font:600 17px/1.2 var(--f-ui)}
.mode span{font-size:14px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 14px;font:500 14px/1 var(--f-ui);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--def);border-color:var(--def);color:#001c1a}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:4px}
.tile b{font:600 28px/1 var(--f-ui)}
.tile span{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;align-items:end;height:90px}
.bars i{display:block;background:var(--def);border-radius:4px 4px 0 0;min-height:3px}
.bars i.today{background:var(--word)}
.bars .bar{display:block;background:var(--def);border:0;padding:0;border-radius:4px 4px 0 0;min-height:3px;cursor:pointer;width:100%}
.bars .bar.today{background:var(--word)}
.bars .bar:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.cal{display:grid;gap:10px}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-top b{font:600 16px/1.2 var(--f-ui)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-h{font:600 11px/1 var(--f-ui);color:var(--muted);text-align:center;padding:4px 0;letter-spacing:.06em}
.cal-d{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:500 14px/1 var(--f-ui);cursor:pointer;padding:0;min-width:0}
.cal-d.l1{background:rgba(25,181,174,.22)}
.cal-d.l2{background:rgba(25,181,174,.45)}
.cal-d.l3{background:rgba(25,181,174,.7);color:#001c1a}
.cal-d.l4{background:var(--def);color:#001c1a}
.cal-d.today{outline:2px solid var(--word);outline-offset:1px}
.cal-d.fut{opacity:.35;cursor:default}
.fld{display:grid;gap:6px;min-width:0}
.fld>span{font:600 12px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.din{width:100%;box-sizing:border-box;min-height:44px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;color:var(--text);font:500 16px/1.2 var(--f-ui);padding:8px 10px;color-scheme:inherit}
.mode[disabled]{opacity:.5;cursor:default}
details.more{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
details.more>summary{cursor:pointer;font:600 15px/1.3 var(--f-ui);color:var(--def);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";font-size:20px;color:var(--muted)}
details.more[open]>summary::after{content:"–"}
details.apps .appl{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);text-decoration:none}
details.apps .appl b{display:block;font:600 16px/1.3 var(--f-ui);color:var(--word)}
details.apps .appl span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
details.apps .appl.on{border-color:var(--good)}
details.more>.in{display:grid;gap:10px;padding-top:10px}
.barlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.set{display:grid;gap:8px}
.set label,.set .lab{font-weight:500}
select{width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:400 16px var(--f-ui);min-height:48px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:52px;height:30px;appearance:none;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;position:relative;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch input:checked{background:var(--def);border-color:var(--def)}
.switch input:checked::after{transform:translateX(22px);background:#fff}
#ov{position:fixed;inset:0;z-index:40;background:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ovbar{position:sticky;top:0;z-index:2;background:var(--ink);display:flex;align-items:center;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.ovbar .ttl{flex:1;min-width:0;font:600 15px/1.2 var(--f-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--text);padding:0}
.ovbody{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(env(safe-area-inset-bottom,0px) + 32px);display:grid;gap:16px}
.qlabel{font:600 13px/1.2 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;text-align:center}
.qemo{font-size:110px;text-align:center;line-height:1.1}
.qdef{font:400 23px/1.4 var(--f-read);color:var(--def);margin:0;text-align:center}
.qex{font:400 23px/1.4 var(--f-read);color:var(--ex);margin:0;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.opt{font:400 23px/1.2 var(--f-read);color:var(--text);background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px 10px;min-height:70px;cursor:pointer;overflow-wrap:anywhere}
.opt.right{border-color:var(--good);color:var(--good);background:rgba(127,224,160,.08)}
.opt.wrong{border-color:var(--bad);color:var(--bad);background:rgba(255,145,131,.08)}
.compose textarea{width:100%;box-sizing:border-box;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;color:var(--text);font:400 26px/1.3 var(--f-read);padding:14px;text-align:center}
.compose textarea{font-size:19px;text-align:left;min-height:96px;resize:vertical}
.fb{border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.fb.ok{background:rgba(127,224,160,.1);border:1px solid var(--good)}
.fb.no{background:rgba(255,145,131,.1);border:1px solid var(--bad)}
.fb h3{margin:0;font:600 20px/1.2 var(--f-ui)}
.fb.ok h3{color:var(--good)}
.fb.no h3{color:var(--bad)}
.compose{display:grid;gap:10px}
.note{font:400 18px/1.4 var(--f-read);color:var(--ex);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.claude{border-left:3px solid var(--def);padding-left:12px;display:grid;gap:6px}
.claude p{margin:0}
.claude .fix{font:400 19px/1.4 var(--f-read);color:var(--ex)}
.sum{text-align:center;display:grid;gap:10px;padding-top:20px}
.sum .big:not(.btn){font:600 56px/1 var(--f-ui);color:var(--word)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;background:var(--panel-2);border:1px solid var(--def);color:var(--text);border-radius:14px;padding:12px 16px;font-weight:500;max-width:min(420px,calc(100% - 32px));box-sizing:border-box;text-align:center}
.confirm{display:grid;gap:10px;border:1px solid var(--bad);border-radius:14px;padding:14px}
.wod .hw{font-size:clamp(34px,10vw,48px)}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
.tip{font-size:14px;color:var(--muted)}
@media (min-width:700px){#view{padding-top:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* iPhone Safari paints the text of disabled buttons and inputs grey (-webkit-text-fill-color), which made answered choices look empty: keep their real colour */
button:disabled,input:disabled,textarea:disabled,select:disabled{-webkit-text-fill-color:currentColor}
.opt:disabled{opacity:1;cursor:default}
input:disabled,textarea:disabled{opacity:1}

.say{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:inline-grid;place-items:center;cursor:pointer;color:var(--def);padding:0;flex:none}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.say.on{color:var(--word);border-color:var(--word)}
.say.sm{width:34px;height:34px}
.say.sm svg{width:17px;height:17px}
.card .head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.line.ko p,.ko{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--gold)}
.line.ko p{margin:0;font-size:19px;line-height:1.45}
.d.ko{margin-top:2px}

.vh{display:grid;gap:4px}
.vh ol{margin:0;padding-left:1.25em;display:grid;gap:4px;font-size:15px;line-height:1.45}
.vh.mine b{color:var(--word)}

<script type="text/plain" id="wordData">

<script>
(() => {
'use strict';

/* ---------- words ---------- */
const RAW = document.getElementById('wordData').textContent.split('\n').map(s => s.trim()).filter(Boolean);
const POSN = {n:'noun', v:'verb', adj:'adjective', adv:'adverb', prep:'preposition', conj:'conjunction', pron:'pronoun', det:'determiner', num:'number', excl:'exclamation'};
const W = RAW.map((line, i) => {
  const p = line.split('|');
  return {i, w:p[0], pos:p[1], def:p[2], ex:p[3], emo:(p[4] || '').trim(), lv:Math.floor(i / 500) + 1, pk:Math.floor((i % 500) / 20) + 1};
});
const BY = new Map(W.map(x => [x.w, x]));
const KO = new Map(((document.getElementById('koData') || {}).textContent || '').split('\n').map(s => s.trim()).filter(s => s.includes('|')).map(s => { const k = s.indexOf('|'); return [s.slice(0, k), s.slice(k + 1)]; }));   // Korean meanings, shown when the learner turns them on
const koOf = x => (S.set.ko && KO.get(x.w)) || '';

/* ---------- a British voice (the browser's own speech, as in the book courses) ---------- */
const SPEECH = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
let VOICES = [];
function pickVoices() {
  if (!SPEECH) return;
  const gb = speechSynthesis.getVoices().filter(v => /^en[-_]GB/i.test(v.lang));
  const pref = ['Google UK English Female', 'Google UK English Male', 'Daniel', 'Serena', 'Kate', 'Arthur', 'Martha', 'Stephanie', 'Oliver', 'Microsoft Sonia', 'Microsoft Libby', 'Microsoft Ryan', 'Microsoft Hazel', 'Microsoft George', 'Microsoft Susan'];
  const quality = v => /premium|natural|neural/i.test(v.name) ? 0 : /enhanced|google/i.test(v.name) ? 1 : v.localService === false ? 2 : 3;
  const rank = v => { const i = pref.findIndex(q => v.name.startsWith(q)); return i < 0 ? 99 : i; };
  VOICES = gb.slice().sort((a, b) => quality(a) - quality(b) || rank(a) - rank(b));
}
if (SPEECH) { pickVoices(); try { speechSynthesis.addEventListener('voiceschanged', pickVoices); } catch (e) { speechSynthesis.onvoiceschanged = pickVoices; } }
function say(text, btn) {

/* ---------- learning model ---------- */
const INT = [0, 1, 3, 7, 16, 35, 90, 180];
const boxOf = w => (S.p[w] ? S.p[w][0] : 0);
const isLearnt = w => boxOf(w) >= 1;
function grade(w, ok, mode) {   // a word's record: [box, due day, times seen, times wrong, last day, day learnt, days studied]
  const t = DAY();
  const r = S.p[w] ? S.p[w].slice() : [0, t, 0, 0, t];
  const was = r[0];
  r[2]++; r[4] = t;
  if (mode === 'known') { r[0] = Math.max(r[0], 3); r[1] = t + INT[r[0]]; }
  else if (mode === 'practice') { if (!ok) r[3]++; }
  else if (ok) { r[0] = Math.min(7, r[0] + 1); r[1] = t + INT[r[0]]; }
  else { r[3]++; if (r[0] > 0) r[0] = 1; r[1] = t + 1; }
  if (was < 1 && r[0] >= 1 && r[5] == null) r[5] = t;
  noteDay(r, t);
  S.p[w] = r; touch(docOf(w));
}
function noteDay(r, t) {   // the study diary: the last 40 days on which this word was studied
  const ds = Array.isArray(r[6]) ? r[6].slice() : [];
  if (ds[ds.length - 1] !== t) ds.push(t);
  r[6] = ds.length > 40 ? ds.slice(-40) : ds;
}
function logAct(kind, ok) {
  const t = DAY(); const L = S.log[t] || (S.log[t] = [0, 0, 0, 0]);
  if (kind === 'new') L[0]++;
  if (kind === 'review') L[1]++;
  if (ok === true) L[2]++;
  if (ok === false) L[3]++;
  touch('meta');
}
const todayLog = () => S.log[DAY()] || [0, 0, 0, 0];
const dueWords = () => { const t = DAY(); return W.filter(x => { const r = S.p[x.w]; return r && r[0] >= 1 && r[1] <= t; }).sort((a, b) => S.p[a.w][1] - S.p[b.w][1]); };
const nextNew = n => { const out = []; for (const x of W) { if (!isLearnt(x.w)) { out.push(x); if (out.length >= n) break; } } return out; };
const learntCount = () => W.reduce((a, x) => a + (isLearnt(x.w) ? 1 : 0), 0);
const masteredCount = () => W.reduce((a, x) => a + (boxOf(x.w) >= 5 ? 1 : 0), 0);
const tricky = () => W.filter(x => { const r = S.p[x.w]; return r && r[3] > 0 && r[0] <= 3; }).sort((a, b) => S.p[b.w][3] - S.p[a.w][3]);
function streak() {
  const has = d => { const L = S.log[d]; return L && (L[0] + L[1]) > 0; };
  let t = DAY(), s = 0; if (!has(t)) t--;
  while (has(t)) { s++; t--; }
  return s;
}
function accuracy() { let ok = 0, all = 0; const keep = DAY() - 30; for (const [k, L] of Object.entries(S.log)) if (+k >= keep) { ok += L[2]; all += L[2] + L[3]; } return all ? Math.round(ok / all * 100) : null; }
const status = w => { const b = boxOf(w); return b >= 5 ? 3 : b >= 1 ? 2 : S.p[w] ? 1 : 0; };
const STATUS = ['New', 'Seen', 'Learning', 'Mastered'];

/* ---------- masking for quizzes ---------- */
function forms(x) {
  const w = x.w.toLowerCase(); const f = new Set([w]);
  const m = x.ex.match(/\[(.+?)\]/); if (m) f.add(m[1].toLowerCase());
  if (w.length <= 2) return [...f];
  ['s', 'es', 'ed', 'd', 'ing', 'er', 'est', 'ly', 'ers'].forEach(s => f.add(w + s));
  if (w.endsWith('e')) { f.add(w.slice(0, -1) + 'ing'); f.add(w.slice(0, -1) + 'y'); }
  if (w.endsWith('y')) ['ies', 'ied', 'ier', 'iest', 'ily'].forEach(s => f.add(w.slice(0, -1) + s));
  const last = w.slice(-1); if (/[bdgmnprt]/.test(last)) ['ed', 'ing', 'er', 'est'].forEach(s => f.add(w + last + s));
  return [...f];
}
function mask(text, x) {
  const alts = forms(x).map(esc).sort((a, b) => b.length - a.length).join('|');
  return text.replace(new RegExp('(^|[^A-Za-z\'])(' + alts + ')(?=$|[^A-Za-z\'])', 'gi'), (m, p) => p + '_____');
}

/* ---------- overlay screens ----------
   Screens stack up: opening one from inside another keeps the first (with anything typed in it),
   and Back returns to it. */
const OV = {open:false, onclose:null, onreturn:null, stack:[]};
function openOv(title, onclose) {
  const ov = $('#ov');
  if (OV.open) {
    const top = ov.scrollTop, frag = document.createDocumentFragment();
    while (ov.firstChild) frag.append(ov.firstChild);
    OV.stack.push({frag, top, onclose:OV.onclose, onreturn:OV.onreturn});
  } else {
    ov.hidden = false; OV.open = true;
    document.documentElement.classList.add('locked');
  }
  OV.onclose = onclose || null; OV.onreturn = null;
  const bar = el('div', {class:'ovbar'}, el('button', {class:'x', type:'button', 'aria-label':'Back', title:'Back', onclick:goBack}, svg(ICON.back)), el('div', {class:'ttl'}, title));
  const body = el('div', {class:'ovbody'});
  ov.append(bar, body); ov.scrollTop = 0;
  return {bar, body, setTitle:t => { bar.querySelector('.ttl').textContent = t; }, onReturn:f => { OV.onreturn = f; }};
}
function closeOv() {   // closes the top screen and shows the one under it
  if (!OV.open) return;
  const ov = $('#ov'), f = OV.onclose, prev = OV.stack.pop();
  put(ov);
  if (prev) {
    ov.append(prev.frag);
    OV.onclose = prev.onclose; OV.onreturn = prev.onreturn;
    if (f) f();
    if (OV.onreturn) OV.onreturn();
    ov.scrollTop = prev.top;
    return;
  }
  ov.hidden = true; OV.open = false; OV.onclose = null; OV.onreturn = null;
  document.documentElement.classList.remove('locked');
  if (f) f();
  render();
}
function closeAllOv() {   // closes every screen, without drawing the page underneath
  if (!OV.open) return;
  const fs = [OV.onclose, ...OV.stack.map(s => s.onclose).reverse()];
  const ov = $('#ov'); ov.hidden = true; put(ov);
  OV.open = false; OV.stack = []; OV.onclose = null; OV.onreturn = null;
  document.documentElement.classList.remove('locked');
  fs.forEach(f => { if (f) f(); });
}

/* ---------- going back ----------
   Every step into the app (a level, a pack, a search, a screen) adds one entry to the browser's history,
   so the on-screen Back buttons, the browser's back button and the phone's back swipe all go back one step. */
const NAV = {on:false, k:0, skip:0, id:Math.random().toString(36).slice(2), y:{}, py:0, pv:''};
const subDepth = () => TAB === 'words' ? (WS.lv ? 1 : 0) + (WS.lv && WS.pk ? 1 : 0) + (WS.q.trim() ? 1 : 0) : 0;
const depth = () => (OV.open ? OV.stack.length + 1 : 0) + subDepth();
const viewKey = () => TAB + ':' + (TAB === 'words' ? WS.lv + '.' + WS.pk + (WS.q.trim() ? '.s' : '') : '');
function backSub() {
  if (TAB !== 'words') return false;
  if (WS.q.trim()) WS.q = ''; else if (WS.pk) WS.pk = 0; else if (WS.lv) WS.lv = 0; else return false;
  return true;
}
function backStep() {
  if (OV.open) { closeOv(); return true; }
  if (!backSub()) return false;
  render(); window.scrollTo(0, NAV.y[viewKey()] || 0);
  return true;
}
function goBack() {
  const s = NAV.on ? history.state : null;
  if (NAV.k > 0 && s && s.id === NAV.id && s.bw === NAV.k) { history.back(); return; }   // the popstate handler takes the step
  if (backStep()) syncNav();
}
function setHash() {
  if (NAV.on) { try { history.replaceState(history.state, '', '#' + TAB); return; } catch (e) { NAV.on = false; } }
  if (location.hash !== '#' + TAB) location.hash = TAB;
}
function syncNav() {   // make the history entries match how deep in the app we are
  if (!NAV.on) return;
  const d = depth();
  if (NAV.k < d) {
    try { while (NAV.k < d) { history.pushState({bw:NAV.k + 1, id:NAV.id}, '', '#' + TAB); NAV.k++; } }
    catch (e) { NAV.on = false; }
  } else if (NAV.k > d) { const n = NAV.k - d; NAV.k = d; NAV.skip++; history.go(-n); }
}
window.addEventListener('popstate', e => {
  if (!NAV.on) return;
  const s = e.state, k = s && s.id === NAV.id ? s.bw : 0;
  if (NAV.skip) { NAV.skip--; NAV.k = k; setHash(); return; }
  NAV.k = k;
  while (depth() > k && backStep()) {}
  const d = depth();
  if (d < k) { NAV.k = d; NAV.skip++; history.go(d - k); }
  setHash();
});
document.addEventListener('click', () => { NAV.py = window.scrollY; NAV.pv = viewKey(); }, true);
document.addEventListener('click', () => { if (viewKey() !== NAV.pv) NAV.y[NAV.pv] = NAV.py; syncNav(); });
document.addEventListener('input', () => syncNav());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && OV.open) goBack(); });

/* ---------- sessions (learn + review + practice) ---------- */
const PRAISE = ['Brilliant!', 'Spot on!', 'Lovely!', 'Well done!', 'Great job!', 'Super!', 'Excellent!'];
const LABEL = {picture:'Which word matches the picture?', meaning:'Which word matches the meaning?', gap:'Which word fills the gap?'};
function kindsFor(x, mode, box) {
  const k = [];
  if (S.set.pics && x.emo) k.push('picture');
  if (x.w.length > 2 || x.pos !== 'det') k.push('meaning');
  k.push('gap');
  if (mode && mode !== 'mixed') return k.includes(mode) ? [mode] : k;
  return k;
}
function distractors(x, kind) {
  const near = W.filter(y => y !== x && y.w.toLowerCase() !== x.w.toLowerCase() && Math.abs(y.i - x.i) < 450);
  let pool = near;
  if (kind === 'picture') pool = near.filter(y => y.emo && y.emo !== x.emo);
  else { const s = near.filter(y => y.pos === x.pos); if (s.length >= 3) pool = s; }
  if (pool.length < 3) pool = W.filter(y => y !== x && (kind !== 'picture' || (y.emo && y.emo !== x.emo)));
  return sample(pool, 3);
}
function startSession(items, title, mode) {
  if (!items.length) { toast('Nothing to do here yet'); return; }
  const o = openOv(title);
  const s = {q:items.slice(), pending:[], total:items.length, step:0, done:{n:0, r:0, ok:0, bad:0}, mode, o, tries:new Map(),
    words:[...new Set(items.map(i => i.x.w))], hist:[]};
  next(s);
}
/* going back inside a session: each screen remembers how things were just before it was shown,
   so Previous and Try again also undo what was marked */
function snap(s) {
  const p = {}, t = DAY();
  for (const w of s.words) p[w] = S.p[w] ? S.p[w].slice() : null;
  return {q:s.q.slice(), pending:s.pending.slice(), total:s.total, step:s.step, done:Object.assign({}, s.done), tries:new Map(s.tries), p, day:t, log:S.log[t] ? S.log[t].slice() : null};
}
function restore(s, h) {
  Object.assign(s, {q:h.q.slice(), pending:h.pending.slice(), total:h.total, step:h.step, done:Object.assign({}, h.done), tries:new Map(h.tries)});
  const docs = new Set();
  for (const w of Object.keys(h.p)) {
    const was = h.p[w], now = S.p[w] || null;
    if (JSON.stringify(was) === JSON.stringify(now)) continue;
    if (was) S.p[w] = was.slice(); else delete S.p[w];
    docs.add(docOf(w));
  }
  if (h.day === DAY() && JSON.stringify(h.log) !== JSON.stringify(S.log[h.day] || null)) { if (h.log) S.log[h.day] = h.log.slice(); else delete S.log[h.day]; docs.add('meta'); }
  docs.forEach(id => touch(id));
}
function stepBack(s) { if (s.hist.length < 2) return; s.hist.pop(); restore(s, s.hist.pop()); next(s); }   // the screen before
function answerAgain(s) { restore(s, s.hist.pop()); next(s); }   // the same question, not answered yet
const prevBtn = s => (s.hist.length > 1 ? el('button', {class:'btn', type:'button', onclick:() => stepBack(s)}, svg(ICON.prev), 'Previous') : null);
function sessBar(s) { const pct = Math.min(100, Math.round(s.step / Math.max(1, s.total) * 100)); return el('div', {class:'pbar', role:'progressbar', 'aria-valuenow':pct, 'aria-valuemin':'0', 'aria-valuemax':'100'}, el('i', {style:'width:' + pct + '%'})); }
function next(s) {
  const peek = s.q[0];
  if (s.pending.length && (s.pending.length >= 5 || !peek || peek.k !== 'learn')) {
    const checks = shuffle(s.pending.splice(0)).map(x => ({k:'check', x}));
    s.q.unshift(...checks); s.total += checks.length;
  }
  s.hist.push(snap(s));
  const it = s.q.shift();
  $('#ov').scrollTop = 0;
  if (!it) return summary(s);
  if (it.k === 'learn' || it.k === 'relearn') return learnCard(s, it);
  return question(s, it);
}
function learnCard(s, it) {
  const x = it.x;
  const first = it.k === 'learn';   // every new word is learnt and then checked: there is no way to skip it
  const go = el('button', {class:'btn primary', type:'button', onclick:() => { s.step++; if (first) s.pending.push(x); next(s); }}, first ? 'Got it' : 'Next');
  put(s.o.body, sessBar(s), el('p', {class:'qlabel'}, first ? 'New word' : 'Have another look'), wordCard(x), el('div', {class:'row'}, prevBtn(s), go));
}
function question(s, it) {
  const x = it.x;
  if (!it.view) { const kinds = kindsFor(x, s.mode, boxOf(x.w)); const kind = kinds[rnd(kinds.length)]; it.view = {kind, opts:shuffle([x, ...distractors(x, kind)])}; }
  const {kind, opts} = it.view;   // the same question if the learner comes back to it
  const parts = [sessBar(s), el('p', {class:'qlabel'}, LABEL[kind])];
  if (kind === 'picture') parts.push(el('div', {class:'qemo', 'aria-hidden':'true'}, x.emo));
  if (kind === 'meaning') parts.push(el('p', {class:'qdef'}, mask(x.def, x)));
  if (kind === 'gap') parts.push(el('p', {class:'qex'}, '→ ' + x.ex.replace(/\[(.+?)\]/, '_____')));
  const grid = el('div', {class:'opts'});
  opts.forEach(y => {
    const b = el('button', {class:'opt', type:'button', lang:'en-GB'}, y.w);
    b.addEventListener('click', () => {
      grid.querySelectorAll('button').forEach(z => { z.disabled = true; if (z.textContent === x.w) z.classList.add('right'); });
      if (y !== x) b.classList.add('wrong');
      answer(s, it, kind, y === x);
    });
    grid.append(b);
  });
  parts.push(grid);
  const pb = prevBtn(s);
  if (pb) parts.push(el('div', {class:'row qprev'}, pb));
  put(s.o.body, ...parts);
}
function answer(s, it, kind, ok) {
  const x = it.x;
  if (it.k === 'review') { grade(x.w, ok, 'review'); logAct('review', ok); s.done.r++; if (!ok) { s.q.splice(Math.min(2, s.q.length), 0, {k:'relearn', x}); s.q.push({k:'again', x}); s.total += 2; } }
  else if (it.k === 'check') {
    if (ok) { if (!isLearnt(x.w)) { grade(x.w, true, 'check'); logAct('new', true); s.done.n++; } else logAct(null, true); }
    else { if (!S.p[x.w]) { S.p[x.w] = [0, DAY(), 1, 1, DAY()]; touch(docOf(x.w)); } logAct(null, false); const n = (s.tries.get(x.w) || 0) + 1; s.tries.set(x.w, n); if (n < 3) { s.q.push({k:'check', x}); s.total++; } }
  }
  else if (it.k === 'practice') { grade(x.w, ok, 'practice'); logAct(null, ok); }
  else { logAct(null, ok); }
  if (ok) s.done.ok++; else s.done.bad++;
  s.step++;
  const fb = el('section', {class:'fb ' + (ok ? 'ok' : 'no')},
    el('h3', null, ok ? PRAISE[rnd(PRAISE.length)] : 'Not quite. The answer is ' + x.w + '.'),
    el('div', {class:'line ex'}, el('p', null, '→ ', exampleNodes(x.ex)), sayBtn(x.ex, 'sm')),

  }
  put(body, lv);
}
function practiceSource() {
  const learnt = W.filter(x => isLearnt(x.w));
  const n = nextNew(1)[0];
  const cur = n ? packWords(n.lv, n.pk) : learnt;
  return {
    learnt:{label:'Learnt words', list:learnt},
    tricky:{label:'Tricky words', list:tricky()},
    starred:{label:'Starred', list:S.stars.map(w => BY.get(w)).filter(Boolean)},
    pack:{label:n ? 'Pack ' + n.pk + ', Level ' + n.lv : 'Last pack', list:cur}
  };
}
function renderPractise() {
  const src = practiceSource();
  if (!src[PS]) PS = 'learnt';
  const seg = el('div', {class:'seg', role:'group', 'aria-label':'Words to practise'},
    Object.entries(src).map(([k, v]) => el('button', {type:'button', 'aria-pressed':PS === k ? 'true' : 'false', onclick:() => { PS = k; renderPractise(); }}, v.label + ' (' + v.list.length + ')')));
  const list = src[PS].list;
  const M = [
    ['mixed', '🎯', 'Mixed quiz', 'Ten questions of every kind.'],
    ['picture', '🖼️', 'Picture match', 'See a picture and choose the word.'],
    ['meaning', '📖', 'Meaning match', 'Read the meaning and choose the word.'],
    ['gap', '✏️', 'Fill the gap', 'Choose the word that completes the sentence.']
  ];
  const modes = el('div', {class:'modes'}, M.map(([k, ic, t, d]) => el('button', {class:'mode', type:'button', onclick:() => {
      let l = list; if (k === 'picture') l = list.filter(x => x.emo);
      if (l.length < 1) { toast(k === 'picture' ? 'None of these words has a picture' : 'No words here yet'); return; }
      startPractice(l, k, t);
    }}, el('span', {class:'ic', 'aria-hidden':'true'}, ic), el('span', null, el('b', null, t), el('span', null, d)))));
  put(view, el('header', {class:'hello'}, el('p', {class:'eyebrow'}, 'Practise'), el('h1', null, 'Choose your words')), seg,
    list.length ? modes : el('p', {class:'empty'}, PS === 'starred' ? 'Tap Star on any word card to collect it here.' : PS === 'tricky' ? 'Words you get wrong will appear here.' : 'Learn some words on the Today tab first.'),
    rangePanel());
}
function renderMe() {
  const learnt = learntCount(), mast = masteredCount(), st = streak(), acc = accuracy();
  const daily = el('div', {class:'seg', role:'group', 'aria-label':'New words a day'}, [5, 10, 15, 20, 30].map(n => el('button', {type:'button', 'aria-pressed':S.set.daily === n ? 'true' : 'false', onclick:() => { S.set.daily = n; touch('meta'); renderMe(); }}, String(n))));
  const pick = (label, key, opts) => el('div', {class:'seg', role:'group', 'aria-label':label}, opts.map(([v, t]) => el('button', {type:'button', 'aria-pressed':(S.set[key] ?? blank().set[key]) === v ? 'true' : 'false', onclick:() => { S.set[key] = v; touch('meta'); renderMe(); }}, t)));
  const order = pick("Today's words start with", 'order', [['reviews', 'Reviews'], ['new', 'New words'], ['mixed', 'Mix them']]);
  const revMax = pick('Most reviews at a time', 'revMax', [10, 20, 30, 50, 80].map(n => [n, String(n)]));
  const sw = (id, label, key, dflt = false) => { const i = el('input', {type:'checkbox', id, role:'switch'}); i.checked = S.set[key] == null ? dflt : !!S.set[key]; i.addEventListener('change', () => { S.set[key] = i.checked; touch('meta'); }); return el('div', {class:'switch'}, el('label', {for:id}, label), i); };
  const lists = el('div', {class:'list'},
    listBtn('Starred words', () => S.stars.map(w => BY.get(w)).filter(Boolean)),
    listBtn('Tricky words', tricky),
    sentencesBtn());
  const resetArea = el('div');
  const resetBtn = el('button', {class:'btn ghost', type:'button', onclick:() => {
    put(resetArea, el('div', {class:'confirm'}, el('b', null, 'Delete all the progress in “' + nbName() + '”?'), el('span', {class:'muted'}, 'The learnt words, stars, sentences and streak in this notebook will be cleared.' + (NBS.list.length > 1 ? ' Your other notebooks stay as they are.' : '') + ' This cannot be undone.'),
      el('div', {class:'row'}, el('button', {class:'btn', type:'button', onclick:() => put(resetArea, resetBtn)}, 'Keep my progress'),
        el('button', {class:'btn primary', type:'button', onclick:() => { const keepSet = S.set; S = blank(); S.set = keepSet; DOCS.forEach(id => touch(id)); toast('Progress cleared'); renderMe(); }}, 'Yes, delete it'))));
  }}, 'Reset this notebook');
  resetArea.append(resetBtn);
  const sync = FB ? null : cloud.mode === 'cloud' ? 'Your progress is saved to your Claude account, so it follows you to other devices.' : cloud.mode === 'connecting' ? 'Connecting to your saved progress…' : 'Your progress is saved in this browser only.';   // with accounts, the Account panel says where progress is kept
  put(view, 
    el('header', {class:'hello'}, el('p', {class:'eyebrow'}, 'Me'), el('h1', null, 'My progress')),
    appsToggle(),
    accountPanel(),
    notebookPanel(),
    el('div', {class:'tiles'},
      el('div', {class:'tile'}, el('b', {class:'num'}, fmt(learnt)), el('span', null, 'words learnt')),
      el('div', {class:'tile'}, el('b', {class:'num'}, fmt(mast)), el('span', null, 'mastered')),
      el('div', {class:'tile'}, el('b', {class:'num'}, st), el('span', null, 'day streak')),
      el('div', {class:'tile'}, el('b', {class:'num'}, acc == null ? '–' : acc + '%'), el('span', null, 'correct, last 30 days'))),
    studyPanel(),
    lists,
    el('section', {class:'panel set'}, el('p', {class:'eyebrow'}, 'Settings'),
      el('span', {class:'lab'}, 'Background'), themeSeg(),
      el('span', {class:'lab'}, 'New words a day'), daily,
      el('span', {class:'lab'}, "Today's words start with"), order,
      el('span', {class:'lab'}, 'Most reviews at a time'), revMax,
      sw('pics', 'Show pictures', 'pics'),
      sw('ko', '한국어 뜻 보기 · Show Korean meanings', 'ko'),
      SPEECH ? sw('voice', 'Read words aloud (British voice)', 'voice', true) : null,
      SPEECH ? voiceHelp() : null,
      sync ? el('p', {class:'tip'}, sync) : null,
      installRow(),
      resetArea));
}
function listBtn(title, get) {   // get() gives the words now, so the list is fresh when you come back to it
  const list = get();
  return el('button', {class:'item', type:'button', onclick:() => {
    const o = openOv(title);
    const draw = () => { const l = get(); put(o.body, l.length ? el('div', {class:'list'}, l.map(x => wordRow(x, l))) : el('p', {class:'empty'}, 'Nothing here yet.')); };
    draw(); o.onReturn(draw);
  }}, el('span', {class:'e'}, title.startsWith('Starred') ? '⭐' : '🧩'), el('span', null, el('div', {style:'font-weight:600'}, title), el('div', {class:'d'}, list.length + ' word' + (list.length === 1 ? '' : 's'))), el('span', {'aria-hidden':'true'}, '›'));
}
function sentencesBtn() {
  const noted = () => Object.keys(S.notes).filter(w => BY.get(w));
  const keys = noted();
  return el('button', {class:'item', type:'button', onclick:() => {
    const o = openOv('My sentences');
    const draw = () => { const ks = noted();
      put(o.body, ks.length ? el('div', {class:'list'}, ks.map(w => { const x = BY.get(w), n = S.notes[w];
        return el('button', {class:'item', type:'button', onclick:() => openWord(x)}, el('span', {class:'e'}, x.emo || ''), el('span', {style:'min-width:0'}, el('div', {class:'w'}, x.w), el('div', {style:'font:400 17px/1.4 var(--f-read);color:var(--ex);margin-top:4px'}, n.t)), el('span', {class:'dot s' + (n.f ? (n.f.ok ? 3 : 2) : 0)})); })) : el('p', {class:'empty'}, 'Open any word card and write your own sentence. It will be saved here.')); };
    draw(); o.onReturn(draw);
  }}, el('span', {class:'e'}, '✍️'), el('span', null, el('div', {style:'font-weight:600'}, 'My sentences'), el('div', {class:'d'}, keys.length + ' sentence' + (keys.length === 1 ? '' : 's'))), el('span', {'aria-hidden':'true'}, '›'));
}

/* ---------- routing ---------- */
const view = $('#view');
const TABS = ['today', 'words', 'practise', 'me'];
function render() {
  if (OV.open) return;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === TAB ? 'page' : 'false'));
  if (TAB === 'words') renderWords(); else if (TAB === 'practise') renderPractise(); else if (TAB === 'me') renderMe(); else renderToday();
}
function fromHash() { const h = location.hash.slice(1); TAB = TABS.includes(h) ? h : 'today'; }
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  closeAllOv();
  if (b.dataset.tab === 'words' && TAB === 'words') { WS.lv = 0; WS.pk = 0; WS.q = ''; }
  TAB = b.dataset.tab;
  setHash(); render();
  window.scrollTo(0, 0);
}));   // the click listener in "going back" then lines the history up
window.addEventListener('hashchange', () => {   // only a hash typed by hand gets here; the app's own moves keep it in step
  const h = location.hash.slice(1);
  if (h === TAB || !TABS.includes(h)) return;
  closeAllOv(); TAB = h; render(); syncNav();
});
fromHash();
try { history.replaceState({bw:0, id:NAV.id}, '', '#' + TAB); NAV.on = true; history.scrollRestoration = 'manual'; } catch (e) { NAV.on = !!NAV.on; }   // the app puts the scroll back itself
render();
initCloud();
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('sample').then(s => { SAMPLE = s || null; document.querySelectorAll('.compose .btn.primary').forEach(b => { b.hidden = !SAMPLE; }); }).catch(() => {});
}
})();
