   pink for words and phrases to learn, teal for meanings and instructions, pale cyan for examples; tab bar under the thumb. */
:root{
  color-scheme: dark;
  --ink:#000000;
  --panel:#0a1012;
  --panel-2:#111a1d;
  --line:#21313a;
  --word:#ff80d5;
  --def:#19b5ae;
  --ex:#b8fff4;
  --text:#e8f3f2;
  --muted:#93aaa8;
  --good:#7fe0a0;
  --bad:#ff9183;
  --gold:#ffd36e;
  --f-read:"Andika","Trebuchet MS",system-ui,sans-serif;
  --f-ui:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabh:62px;
  --rs:1;
}
html.large{--rs:1.15}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
html.locked,html.locked body{overflow:hidden}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
#view{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 32px);display:grid;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(0,0,0,.94);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab{appearance:none;background:none;border:0;color:var(--muted);font:500 11.5px/1 var(--f-ui);letter-spacing:.01em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:var(--tabh);cursor:pointer;padding:0 2px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--word)}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:600 16px/1.2 var(--f-ui);border-radius:14px;padding:12px 16px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-align:center}
.btn.primary{background:var(--word);border-color:var(--word);color:#22001a}
.btn.teal{background:var(--def);border-color:var(--def);color:#001c1a}
.btn.big{width:100%;font-size:18px;min-height:56px}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--ex);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 140px}
.eyebrow{font:600 12px/1.2 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.tip{font-size:14px;color:var(--muted);margin:0}
.hello{display:grid;gap:4px;padding-top:6px}
.hello h1{font:600 26px/1.15 var(--f-ui);margin:0}
.hello .lv{font:500 15px/1.3 var(--f-ui);color:var(--def);margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px;min-width:0}
.panel h2{margin:0;font:600 19px/1.25 var(--f-ui)}
.goal{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:600 24px/1 var(--f-ui)}
.ring .t small{display:block;font:500 10.5px/1.3 var(--f-ui);color:var(--muted);margin-top:4px;letter-spacing:.04em}
.stats{display:grid;gap:8px}
.stat{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.stat:last-child{border-bottom:0;padding-bottom:0}
.stat b{font-weight:600}
.pbar{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--word);border-radius:99px}
.pbar.teal>i{background:var(--def)}
.card{background:var(--ink);border:1px solid var(--line);border-radius:22px;padding:22px 18px 24px;display:grid;gap:14px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.hw{font:400 clamp(34px,10vw,52px)/1.1 var(--f-read);color:var(--word);margin:0;overflow-wrap:anywhere;min-width:0}
.hw.sm{font-size:clamp(28px,8vw,40px)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;letter-spacing:.04em}
.chip.note{color:var(--gold);border-color:#4a4226}
.line{display:flex;align-items:flex-start;gap:12px;min-width:0}
.line p{margin:0;flex:1;min-width:0;font-family:var(--f-read);font-size:calc(21px * var(--rs));line-height:1.4}
.def p{color:var(--def)}
.ex p{color:var(--ex)}
.tgt{color:var(--word)}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools .btn{flex:1 1 120px}
.star.on{color:var(--gold);border-color:var(--gold)}
.star.on svg{fill:var(--gold);stroke:var(--gold)}
.say{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:inline-grid;place-items:center;cursor:pointer;color:var(--def);padding:0;flex:none}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.say.on{color:var(--word);border-color:var(--word)}
.say.sm{width:34px;height:34px}
.say.sm svg{width:17px;height:17px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;min-width:0;color:var(--text)}
.item .e{font-size:22px;width:30px;text-align:center}
.item .id{font:600 13px/1 var(--f-ui);color:var(--muted);min-width:34px;text-align:center}
.item .w{font:400 calc(20px * var(--rs))/1.25 var(--f-read);color:var(--word);overflow-wrap:anywhere}
.item .d{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item.off{opacity:.42;cursor:default}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.dot.s1{border-color:var(--def)}
.dot.s2{background:var(--def);border-color:var(--def)}
.dot.s3{background:var(--gold);border-color:var(--gold)}
.sechead{font:600 13px/1.2 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--def);margin:10px 0 0}
/* the library */
.shelf{display:grid;gap:10px}
.book{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;width:100%;min-width:0;color:var(--text)}
.book.on{border-color:var(--word)}
.book.soon{opacity:.5;cursor:default}
.spine{width:34px;height:48px;border-radius:6px;display:grid;place-items:end center;padding-bottom:5px;box-sizing:border-box;font:700 10px/1 var(--f-ui);color:#000;letter-spacing:.02em}
.book h3{margin:0;font:600 16.5px/1.25 var(--f-ui)}
.book .s{font-size:13px;color:var(--muted);margin-top:2px}
.book .pbar{margin-top:8px}
.book .n{font:600 13px/1.2 var(--f-ui);color:var(--muted);text-align:right;white-space:nowrap}
/* add to home screen (website copies) */
.instbar{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.instgo{flex:1;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:12px 14px;cursor:pointer;min-width:0}
.instgo b{display:block;font:600 16px/1.25 var(--f-ui)}
.instgo .muted{display:block;font-size:14px;margin-top:2px}
.instx{background:none;border:0;border-left:1px solid var(--line);color:var(--muted);width:52px;display:grid;place-items:center;cursor:pointer;flex:none}
.instx svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.insthelp{display:grid;gap:16px;max-width:520px;margin:0 auto;width:100%}
.isteps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.istep{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.istep .n{width:32px;height:32px;border-radius:50%;background:var(--word);color:#000;display:grid;place-items:center;font:700 16px/1 var(--f-ui);flex:none}
.istep b{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font:600 17px/1.3 var(--f-ui)}
.istep p{margin:6px 0 0;font-size:15px;line-height:1.45}
.ic{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--def)}
.ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* light background, chosen in Me (kept on this device; all the apps on one site share it) */
html.light{color-scheme:light;--ink:#ffffff;--panel:#f4f7f7;--panel-2:#e9eff0;--line:#d3dee1;--word:#c0157a;--def:#0a7c76;--ex:#1f4f4b;--text:#132322;--muted:#5c6f6d;--good:#1f7a46;--bad:#c0392b;--gold:#8a6400}
html.light .tabs{background:rgba(255,255,255,.94)}
html.light .btn.primary{background:#ff80d5;border-color:#ff80d5;color:#22001a}
html.light .btn.teal,html.light .seg button[aria-pressed="true"]{background:#19b5ae;border-color:#19b5ae;color:#001c1a}
html.light .switch input:checked{background:#19b5ae;border-color:#19b5ae}
html.light .istep .n{background:#ff80d5}
html.light .nbrow.on .tick{background:#19b5ae;border-color:#19b5ae}
html.light .box.gb,html.light .chip.note{border-color:#e3d29a}
html.light .tline .wt{border-color:#f2bddf}
/* notebooks */
.nbwrap{display:grid;gap:14px;max-width:520px;margin:0 auto;width:100%}
.nblist{display:grid;gap:10px}
.nbrow{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 14px 8px}
.nbrow.on{border-color:var(--def)}
.nbpick{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--text);font:600 17px/1.3 var(--f-ui);padding:10px 0;text-align:left;cursor:pointer;min-height:48px}
.nbpick .tick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:15px;line-height:1;color:#000;flex:none}
.nbrow.on .tick{background:var(--def);border-color:var(--def)}
.nbpick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbpick .tag{font:600 12px/1 var(--f-ui);color:var(--def);text-transform:uppercase;letter-spacing:.08em;flex:none}
.nbacts{display:flex;gap:20px;padding-left:38px}
.nbedit{display:grid;gap:8px;padding:10px 0 4px}
.nbnew{display:grid;gap:8px;background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:14px}
.nbnew label{font:600 14px/1.2 var(--f-ui);color:var(--muted)}
.nbnew .btn{margin-top:6px}
.nbrow .confirm{margin:10px 0 4px}
.nbline{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid var(--line);border-radius:14px;color:var(--muted);font:500 15px/1.3 var(--f-ui);padding:10px 14px;cursor:pointer;text-align:left;min-height:44px}
.nbline b{color:var(--text);font-weight:600}
.nbline svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nbline .chev{margin-left:auto;font-size:22px;line-height:1}
/* accounts (website copies) */
.acct .big1{font:600 18px/1.25 var(--f-ui)}
.who{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);font:600 18px/1 var(--f-ui);color:var(--text);flex:none}
.av svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who .nm{display:block;font:600 18px/1.25 var(--f-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--text);font:inherit;cursor:pointer}
.acctbar b{display:block;font:600 16px/1.25 var(--f-ui)}
.acctbar .muted{display:block;font-size:14px;margin-top:2px}
.acctbar .chev{margin-left:auto;color:var(--muted);font-size:24px;line-height:1}
.signedin{margin:0;font-size:14px}
.signedin b{color:var(--text);font-weight:600}
.acctwrap{display:grid;gap:14px;max-width:480px;margin:0 auto;width:100%}
.accth{font:600 24px/1.2 var(--f-ui);margin:6px 0 0}
.acctform{display:grid;gap:6px}
.acctform label{font:600 14px/1.2 var(--f-ui);color:var(--muted);margin-top:10px}
.field{width:100%;box-sizing:border-box;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;color:var(--text);font:400 18px/1.3 var(--f-ui);padding:13px 14px;min-height:52px}
.field:focus{outline:none;border-color:var(--def)}
.formmsg{margin:10px 0 0;color:var(--bad);font-size:15px;line-height:1.4}
.formmsg.ok{color:var(--good)}
.acctform .btn{margin-top:14px}
.acctlinks{display:flex;flex-wrap:wrap;gap:0 20px}
.linkbtn{background:none;border:0;color:var(--def);font:500 15px/1.3 var(--f-ui);padding:10px 0;min-height:44px;cursor:pointer;text-align:left}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font:500 15px/1 var(--f-ui);padding:6px 12px 6px 0;min-height:44px;text-decoration:none;cursor:pointer;justify-self:start}
.back svg,.x svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;width:100%;color:var(--text)}
.mode .ic{width:44px;height:44px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;font-size:22px}
.mode b{display:block;font:600 17px/1.2 var(--f-ui)}
.mode span{font-size:14px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 14px;font:500 14px/1 var(--f-ui);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--def);border-color:var(--def);color:#001c1a}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:4px}
.tile b{font:600 28px/1 var(--f-ui)}
.tile span{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;align-items:end;height:90px}
.bars i{display:block;background:var(--def);border-radius:4px 4px 0 0;min-height:3px}
.bars i.today{background:var(--word)}
.barlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.set{display:grid;gap:8px}
.set label,.set .lab{font-weight:500}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:52px;height:30px;appearance:none;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;position:relative;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch input:checked{background:var(--def);border-color:var(--def)}
.switch input:checked::after{transform:translateX(22px);background:#fff}
#ov{position:fixed;inset:0;z-index:40;background:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ovbar{position:sticky;top:0;z-index:2;background:var(--ink);display:flex;align-items:center;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.ovbar .ttl{flex:1;min-width:0;font:600 15px/1.2 var(--f-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--text);padding:0;flex:none}
.ovbody{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(env(safe-area-inset-bottom,0px) + 40px);display:grid;gap:16px}
/* unit pages: the left-hand page of the book */
.qhead{display:grid;gap:8px}
.ttl-big{margin:0;font:400 calc(30px * var(--rs))/1.15 var(--f-read);color:var(--word)}
.sub{margin:0;color:var(--muted);font-size:15px}
.learn{display:grid;gap:12px}
.learn h3{margin:12px 0 0;font:600 15px/1.3 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--def)}
.learn h3:first-child{margin-top:0}
.learn p{margin:0;font:400 calc(18px * var(--rs))/1.5 var(--f-read)}
.learn .rule{display:grid;grid-template-columns:auto 1fr;gap:10px;font:400 calc(18px * var(--rs))/1.5 var(--f-read)}
.learn .rule::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--def);margin-top:.62em}
.learn .exl{display:flex;gap:10px;align-items:flex-start;margin:0;font:400 calc(20px * var(--rs))/1.45 var(--f-read);color:var(--ex);padding-left:14px;border-left:2px solid var(--line)}
.learn .exl span{flex:1;min-width:0}
mark.h{background:none;color:var(--word)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.box>.eyebrow{color:var(--def)}
.box.gb{border-color:#4a4226}
.box.gb>.eyebrow{color:var(--gold)}
.box.mis{border-color:#5a2a2a}
.box.mis>.eyebrow{color:var(--bad)}
.box p{margin:0;font:400 calc(18px * var(--rs))/1.5 var(--f-read)}
.wl{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;min-width:0}
.wrow .dot{margin-top:9px}
.wrow .w{font:400 calc(21px * var(--rs))/1.25 var(--f-read);color:var(--word);overflow-wrap:anywhere;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.wrow .pos{font:500 12px/1 var(--f-ui);color:var(--muted);margin-left:6px;letter-spacing:.04em}
.wrow .d{font:400 calc(17px * var(--rs))/1.4 var(--f-read);color:var(--def);margin-top:4px}
.wrow .x2{font:400 calc(17px * var(--rs))/1.4 var(--f-read);color:var(--ex);margin-top:4px}
.wrow .nt{font:500 12.5px/1.3 var(--f-ui);color:var(--gold);margin-top:4px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font:400 calc(16.5px * var(--rs))/1.35 var(--f-read)}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:70px}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font:600 12px/1.2 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel-2)}
.tbl td:first-child{color:var(--def)}
@media (max-width:600px){
  .tbl.stack{border:0;border-radius:0;overflow:visible}
  .tbl.stack table,.tbl.stack tbody,.tbl.stack tr,.tbl.stack td{display:block;width:auto}
  .tbl.stack thead{display:none}
  .tbl.stack tr{border:1px solid var(--line);border-radius:12px;padding:6px 0;margin:0 0 10px}
  .tbl.stack tr:last-child{margin-bottom:0}
  .tbl.stack td{border:0;padding:5px 14px;min-width:0}
  .tbl.stack td[data-h]::before{content:attr(data-h);display:block;font:600 11px/1.3 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
}
details.more{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
details.more>summary{cursor:pointer;font:600 15px/1.3 var(--f-ui);color:var(--def);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";font-size:20px;color:var(--muted)}
details.more[open]>summary::after{content:"–"}
details.more>.in{display:grid;gap:10px;padding-top:10px}
/* practice: the right-hand page */
.qcount{display:flex;justify-content:space-between;gap:10px;font:500 13px/1.2 var(--f-ui);color:var(--muted)}
.qinstr{margin:0;font:400 calc(17px * var(--rs))/1.4 var(--f-read);color:var(--def)}
.qtext{margin:0;font:400 calc(24px * var(--rs))/1.45 var(--f-read);color:var(--text);overflow-wrap:anywhere}
.qtext.def{color:var(--def)}
.qtext.ex{color:var(--ex)}
.qtext.big{font-size:calc(34px * var(--rs));text-align:center;color:var(--word)}
.qtext input.inl{font:inherit;color:var(--word);background:var(--panel);border:0;border-bottom:2px solid var(--def);border-radius:6px 6px 0 0;padding:2px 6px;width:7.5em;max-width:100%;box-sizing:border-box}
.qtext input.inl:focus{outline:none;border-bottom-color:var(--word)}
.gap{color:var(--word);font-weight:700}
.hint{font:500 15px/1.3 var(--f-ui);color:var(--muted);letter-spacing:.12em;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opts.long{grid-template-columns:1fr}
.opt{font:400 calc(21px * var(--rs))/1.25 var(--f-read);color:var(--text);background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 10px;min-height:62px;cursor:pointer;overflow-wrap:anywhere}
.opts.long .opt{font-size:calc(18px * var(--rs));text-align:left;padding:12px 14px;min-height:52px}
.opt.right{border-color:var(--good);color:var(--good);background:rgba(127,224,160,.08)}
.opt.wrong{border-color:var(--bad);color:var(--bad);background:rgba(255,145,131,.08)}
.listen{display:grid;place-items:center;gap:8px}
.listen .say{width:88px;height:88px}
.listen .say svg{width:40px;height:40px}
textarea.w,input.w{width:100%;box-sizing:border-box;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;color:var(--word);font:400 calc(21px * var(--rs))/1.4 var(--f-read);padding:12px 14px;min-height:54px;resize:none;overflow:hidden}
textarea.w.piece{min-height:180px;overflow:auto;resize:vertical;color:var(--text)}
textarea.w:focus,input.w:focus{border-color:var(--def);outline:none}
.tline{min-height:62px;border:1.5px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tbank{display:flex;flex-wrap:wrap;gap:8px}
.wt{font:400 calc(20px * var(--rs))/1.2 var(--f-read);background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:44px}
.tline .wt{color:var(--word);border-color:#5b2a4c}
.wt[disabled]{visibility:hidden}
.fb{border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:rgba(127,224,160,.1);border:1px solid var(--good)}
.fb.no{background:rgba(255,145,131,.1);border:1px solid var(--bad)}
.fb + .row{margin-top:12px}
.fb h3{margin:0;font:600 19px/1.2 var(--f-ui)}
.fb.ok h3{color:var(--good)}
.fb.no h3{color:var(--bad)}
.fb .ans{font:400 calc(20px * var(--rs))/1.4 var(--f-read);color:var(--ex);margin:0}
.fb .why{margin:0;font-size:15px}
.claude{border-left:3px solid var(--def);padding-left:12px;display:grid;gap:6px}
.claude p{margin:0}
.claude .fix{font:400 calc(19px * var(--rs))/1.45 var(--f-read);color:var(--ex);white-space:pre-wrap}
.sum{text-align:center;display:grid;gap:10px;padding-top:16px}
.sum .big{font:600 56px/1 var(--f-ui);color:var(--word)}
.miss{display:grid;gap:8px;text-align:left}
.miss .m{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:400 calc(17px * var(--rs))/1.4 var(--f-read)}
.miss .m .a{color:var(--ex)}
.compose{display:grid;gap:10px}
.compose textarea{width:100%;box-sizing:border-box;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;color:var(--text);font:400 19px/1.4 var(--f-read);padding:14px;min-height:96px;resize:vertical}
.wc{font:500 13px/1.2 var(--f-ui);color:var(--muted);text-align:right;margin:0}
.wc.ok{color:var(--good)}
/* listening, reading, speaking, timers */
.script{display:grid;gap:8px}
.script p{margin:0;font:400 calc(18px * var(--rs))/1.5 var(--f-read)}
.script b{color:var(--def);font-weight:400}
.passage p{margin:0 0 12px;font:400 calc(18px * var(--rs))/1.6 var(--f-read)}
.passage p:last-child{margin-bottom:0}
.timer{display:grid;gap:10px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.timer .clock{font:600 52px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--word)}
.timer .clock.done{color:var(--gold)}
.timer .lab{font:600 12px/1.2 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.rec{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rec .dotrec{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.cue{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px}
.cue h3{margin:0;font:400 calc(23px * var(--rs))/1.3 var(--f-read);color:var(--word)}
.cue ul{margin:0;padding-left:1.2em;font:400 calc(18px * var(--rs))/1.5 var(--f-read)}
.heard{font:400 calc(18px * var(--rs))/1.4 var(--f-read);color:var(--ex);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;background:var(--panel-2);border:1px solid var(--def);color:var(--text);border-radius:14px;padding:12px 16px;font-weight:500;max-width:min(420px,calc(100% - 32px));box-sizing:border-box;text-align:center}
.confirm{display:grid;gap:10px;border:1px solid var(--bad);border-radius:14px;padding:14px}
.empty{color:var(--muted);text-align:center;padding:20px 10px;margin:0}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);padding-block:8px 6px}
.search input{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--text);font:400 18px/1.2 var(--f-read);padding:13px 14px;min-height:50px}
.loading{color:var(--muted);text-align:center;padding:40px 10px}

<title>British Book Courses</title>
<meta name="apple-mobile-web-app-title" content="Books">
<style>
/* Layout: the same one-hand phone app as 5000 British Words and British Writing and Grammar. Black pages;
   pink for words and phrases to learn, teal for meanings and instructions, pale cyan for examples; tab bar under the thumb. */
:root{
  color-scheme: dark;
  --ink:#000000;
  --panel:#0a1012;
  --panel-2:#111a1d;
  --line:#21313a;
  --word:#ff80d5;
  --def:#19b5ae;
  --ex:#b8fff4;
  --text:#e8f3f2;
  --muted:#93aaa8;
  --good:#7fe0a0;
  --bad:#ff9183;
  --gold:#ffd36e;
  --f-read:"Andika","Trebuchet MS",system-ui,sans-serif;
  --f-ui:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabh:62px;
  --rs:1;
}
html.large{--rs:1.15}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
html.locked,html.locked body{overflow:hidden}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
#view{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 32px);display:grid;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(0,0,0,.94);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab{appearance:none;background:none;border:0;color:var(--muted);font:500 11.5px/1 var(--f-ui);letter-spacing:.01em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:var(--tabh);cursor:pointer;padding:0 2px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--word)}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:600 16px/1.2 var(--f-ui);border-radius:14px;padding:12px 16px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-align:center}
.btn.primary{background:var(--word);border-color:var(--word);color:#22001a}
.btn.teal{background:var(--def);border-color:var(--def);color:#001c1a}
.btn.big{width:100%;font-size:18px;min-height:56px}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--ex);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 140px}
.eyebrow{font:600 12px/1.2 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.tip{font-size:14px;color:var(--muted);margin:0}
.hello{display:grid;gap:4px;padding-top:6px}
.hello h1{font:600 26px/1.15 var(--f-ui);margin:0}
.hello .lv{font:500 15px/1.3 var(--f-ui);color:var(--def);margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px;min-width:0}
.panel h2{margin:0;font:600 19px/1.25 var(--f-ui)}
.goal{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:600 24px/1 var(--f-ui)}
.ring .t small{display:block;font:500 10.5px/1.3 var(--f-ui);color:var(--muted);margin-top:4px;letter-spacing:.04em}
.stats{display:grid;gap:8px}
.stat{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.stat:last-child{border-bottom:0;padding-bottom:0}
.stat b{font-weight:600}
.pbar{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--word);border-radius:99px}
.pbar.teal>i{background:var(--def)}
.card{background:var(--ink);border:1px solid var(--line);border-radius:22px;padding:22px 18px 24px;display:grid;gap:14px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.hw{font:400 clamp(34px,10vw,52px)/1.1 var(--f-read);color:var(--word);margin:0;overflow-wrap:anywhere;min-width:0}
.hw.sm{font-size:clamp(28px,8vw,40px)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;letter-spacing:.04em}
.chip.note{color:var(--gold);border-color:#4a4226}
.line{display:flex;align-items:flex-start;gap:12px;min-width:0}
.line p{margin:0;flex:1;min-width:0;font-family:var(--f-read);font-size:calc(21px * var(--rs));line-height:1.4}
.def p{color:var(--def)}
.ex p{color:var(--ex)}
.tgt{color:var(--word)}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools .btn{flex:1 1 120px}
.star.on{color:var(--gold);border-color:var(--gold)}
.star.on svg{fill:var(--gold);stroke:var(--gold)}
.say{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:inline-grid;place-items:center;cursor:pointer;color:var(--def);padding:0;flex:none}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.say.on{color:var(--word);border-color:var(--word)}
.say.sm{width:34px;height:34px}
.say.sm svg{width:17px;height:17px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;min-width:0;color:var(--text)}
.item .e{font-size:22px;width:30px;text-align:center}
.item .id{font:600 13px/1 var(--f-ui);color:var(--muted);min-width:34px;text-align:center}
.item .w{font:400 calc(20px * var(--rs))/1.25 var(--f-read);color:var(--word);overflow-wrap:anywhere}
.item .d{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item.off{opacity:.42;cursor:default}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.dot.s1{border-color:var(--def)}
.dot.s2{background:var(--def);border-color:var(--def)}
.dot.s3{background:var(--gold);border-color:var(--gold)}
.sechead{font:600 13px/1.2 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--def);margin:10px 0 0}
/* the library */
.shelf{display:grid;gap:10px}
.book{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;width:100%;min-width:0;color:var(--text)}
.book.on{border-color:var(--word)}
.book.soon{opacity:.5;cursor:default}
.spine{width:34px;height:48px;border-radius:6px;display:grid;place-items:end center;padding-bottom:5px;box-sizing:border-box;font:700 10px/1 var(--f-ui);color:#000;letter-spacing:.02em}
.book h3{margin:0;font:600 16.5px/1.25 var(--f-ui)}
.book .s{font-size:13px;color:var(--muted);margin-top:2px}
.book .pbar{margin-top:8px}
.book .n{font:600 13px/1.2 var(--f-ui);color:var(--muted);text-align:right;white-space:nowrap}
/* add to home screen (website copies) */
.instbar{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.instgo{flex:1;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:12px 14px;cursor:pointer;min-width:0}
.instgo b{display:block;font:600 16px/1.25 var(--f-ui)}
.instgo .muted{display:block;font-size:14px;margin-top:2px}
.instx{background:none;border:0;border-left:1px solid var(--line);color:var(--muted);width:52px;display:grid;place-items:center;cursor:pointer;flex:none}
.instx svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.insthelp{display:grid;gap:16px;max-width:520px;margin:0 auto;width:100%}
.isteps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.istep{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.istep .n{width:32px;height:32px;border-radius:50%;background:var(--word);color:#000;display:grid;place-items:center;font:700 16px/1 var(--f-ui);flex:none}
.istep b{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font:600 17px/1.3 var(--f-ui)}
.istep p{margin:6px 0 0;font-size:15px;line-height:1.45}
.ic{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--def)}
.ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* light background, chosen in Me (kept on this device; all the apps on one site share it) */
html.light{color-scheme:light;--ink:#ffffff;--panel:#f4f7f7;--panel-2:#e9eff0;--line:#d3dee1;--word:#c0157a;--def:#0a7c76;--ex:#1f4f4b;--text:#132322;--muted:#5c6f6d;--good:#1f7a46;--bad:#c0392b;--gold:#8a6400}
html.light .tabs{background:rgba(255,255,255,.94)}
html.light .btn.primary{background:#ff80d5;border-color:#ff80d5;color:#22001a}
html.light .btn.teal,html.light .seg button[aria-pressed="true"]{background:#19b5ae;border-color:#19b5ae;color:#001c1a}
html.light .switch input:checked{background:#19b5ae;border-color:#19b5ae}
html.light .istep .n{background:#ff80d5}
html.light .nbrow.on .tick{background:#19b5ae;border-color:#19b5ae}
html.light .box.gb,html.light .chip.note{border-color:#e3d29a}
html.light .tline .wt{border-color:#f2bddf}
/* notebooks */
.nbwrap{display:grid;gap:14px;max-width:520px;margin:0 auto;width:100%}
.nblist{display:grid;gap:10px}
.nbrow{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 14px 8px}
.nbrow.on{border-color:var(--def)}
.nbpick{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--text);font:600 17px/1.3 var(--f-ui);padding:10px 0;text-align:left;cursor:pointer;min-height:48px}
.nbpick .tick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:15px;line-height:1;color:#000;flex:none}
.nbrow.on .tick{background:var(--def);border-color:var(--def)}
.nbpick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbpick .tag{font:600 12px/1 var(--f-ui);color:var(--def);text-transform:uppercase;letter-spacing:.08em;flex:none}
.nbacts{display:flex;gap:20px;padding-left:38px}
.nbedit{display:grid;gap:8px;padding:10px 0 4px}
.nbnew{display:grid;gap:8px;background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:14px}
.nbnew label{font:600 14px/1.2 var(--f-ui);color:var(--muted)}
.nbnew .btn{margin-top:6px}
.nbrow .confirm{margin:10px 0 4px}
.nbline{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid var(--line);border-radius:14px;color:var(--muted);font:500 15px/1.3 var(--f-ui);padding:10px 14px;cursor:pointer;text-align:left;min-height:44px}
.nbline b{color:var(--text);font-weight:600}
.nbline svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nbline .chev{margin-left:auto;font-size:22px;line-height:1}
/* accounts (website copies) */
.acct .big1{font:600 18px/1.25 var(--f-ui)}
.who{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);font:600 18px/1 var(--f-ui);color:var(--text);flex:none}
.av svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who .nm{display:block;font:600 18px/1.25 var(--f-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--text);font:inherit;cursor:pointer}
.acctbar b{display:block;font:600 16px/1.25 var(--f-ui)}
.acctbar .muted{display:block;font-size:14px;margin-top:2px}
.acctbar .chev{margin-left:auto;color:var(--muted);font-size:24px;line-height:1}
.signedin{margin:0;font-size:14px}
.signedin b{color:var(--text);font-weight:600}
.acctwrap{display:grid;gap:14px;max-width:480px;margin:0 auto;width:100%}
.accth{font:600 24px/1.2 var(--f-ui);margin:6px 0 0}
.acctform{display:grid;gap:6px}
.acctform label{font:600 14px/1.2 var(--f-ui);color:var(--muted);margin-top:10px}
.field{width:100%;box-sizing:border-box;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;color:var(--text);font:400 18px/1.3 var(--f-ui);padding:13px 14px;min-height:52px}
.field:focus{outline:none;border-color:var(--def)}
.formmsg{margin:10px 0 0;color:var(--bad);font-size:15px;line-height:1.4}
.formmsg.ok{color:var(--good)}
.acctform .btn{margin-top:14px}
.acctlinks{display:flex;flex-wrap:wrap;gap:0 20px}
.linkbtn{background:none;border:0;color:var(--def);font:500 15px/1.3 var(--f-ui);padding:10px 0;min-height:44px;cursor:pointer;text-align:left}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font:500 15px/1 var(--f-ui);padding:6px 12px 6px 0;min-height:44px;text-decoration:none;cursor:pointer;justify-self:start}
.back svg,.x svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;width:100%;color:var(--text)}
.mode .ic{width:44px;height:44px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;font-size:22px}
.mode b{display:block;font:600 17px/1.2 var(--f-ui)}
.mode span{font-size:14px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 14px;font:500 14px/1 var(--f-ui);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--def);border-color:var(--def);color:#001c1a}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:4px}
.tile b{font:600 28px/1 var(--f-ui)}
.tile span{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;align-items:end;height:90px}
.bars i{display:block;background:var(--def);border-radius:4px 4px 0 0;min-height:3px}
.bars i.today{background:var(--word)}
.barlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.set{display:grid;gap:8px}
.set label,.set .lab{font-weight:500}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:52px;height:30px;appearance:none;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;position:relative;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch input:checked{background:var(--def);border-color:var(--def)}
.switch input:checked::after{transform:translateX(22px);background:#fff}
#ov{position:fixed;inset:0;z-index:40;background:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ovbar{position:sticky;top:0;z-index:2;background:var(--ink);display:flex;align-items:center;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.ovbar .ttl{flex:1;min-width:0;font:600 15px/1.2 var(--f-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--text);padding:0;flex:none}
.ovbody{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(env(safe-area-inset-bottom,0px) + 40px);display:grid;gap:16px}
/* unit pages: the left-hand page of the book */
.qhead{display:grid;gap:8px}
.ttl-big{margin:0;font:400 calc(30px * var(--rs))/1.15 var(--f-read);color:var(--word)}
.sub{margin:0;color:var(--muted);font-size:15px}
.learn{display:grid;gap:12px}
.learn h3{margin:12px 0 0;font:600 15px/1.3 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--def)}
.learn h3:first-child{margin-top:0}
.learn p{margin:0;font:400 calc(18px * var(--rs))/1.5 var(--f-read)}
.learn .rule{display:grid;grid-template-columns:auto 1fr;gap:10px;font:400 calc(18px * var(--rs))/1.5 var(--f-read)}
.learn .rule::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--def);margin-top:.62em}
.learn .exl{display:flex;gap:10px;align-items:flex-start;margin:0;font:400 calc(20px * var(--rs))/1.45 var(--f-read);color:var(--ex);padding-left:14px;border-left:2px solid var(--line)}
.learn .exl span{flex:1;min-width:0}
mark.h{background:none;color:var(--word)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.box>.eyebrow{color:var(--def)}
.box.gb{border-color:#4a4226}
.box.gb>.eyebrow{color:var(--gold)}
.box.mis{border-color:#5a2a2a}
.box.mis>.eyebrow{color:var(--bad)}
.box p{margin:0;font:400 calc(18px * var(--rs))/1.5 var(--f-read)}
.wl{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;min-width:0}
.wrow .dot{margin-top:9px}
.wrow .w{font:400 calc(21px * var(--rs))/1.25 var(--f-read);color:var(--word);overflow-wrap:anywhere;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.wrow .pos{font:500 12px/1 var(--f-ui);color:var(--muted);margin-left:6px;letter-spacing:.04em}
.wrow .d{font:400 calc(17px * var(--rs))/1.4 var(--f-read);color:var(--def);margin-top:4px}
.wrow .x2{font:400 calc(17px * var(--rs))/1.4 var(--f-read);color:var(--ex);margin-top:4px}
.wrow .nt{font:500 12.5px/1.3 var(--f-ui);color:var(--gold);margin-top:4px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font:400 calc(16.5px * var(--rs))/1.35 var(--f-read)}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:70px}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font:600 12px/1.2 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel-2)}
.tbl td:first-child{color:var(--def)}
@media (max-width:600px){
  .tbl.stack{border:0;border-radius:0;overflow:visible}
  .tbl.stack table,.tbl.stack tbody,.tbl.stack tr,.tbl.stack td{display:block;width:auto}
  .tbl.stack thead{display:none}
  .tbl.stack tr{border:1px solid var(--line);border-radius:12px;padding:6px 0;margin:0 0 10px}
  .tbl.stack tr:last-child{margin-bottom:0}
  .tbl.stack td{border:0;padding:5px 14px;min-width:0}
  .tbl.stack td[data-h]::before{content:attr(data-h);display:block;font:600 11px/1.3 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
}
details.more{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
details.more>summary{cursor:pointer;font:600 15px/1.3 var(--f-ui);color:var(--def);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";font-size:20px;color:var(--muted)}
details.more[open]>summary::after{content:"–"}
details.more>.in{display:grid;gap:10px;padding-top:10px}
/* practice: the right-hand page */
.qcount{display:flex;justify-content:space-between;gap:10px;font:500 13px/1.2 var(--f-ui);color:var(--muted)}
.qinstr{margin:0;font:400 calc(17px * var(--rs))/1.4 var(--f-read);color:var(--def)}
.qtext{margin:0;font:400 calc(24px * var(--rs))/1.45 var(--f-read);color:var(--text);overflow-wrap:anywhere}
.qtext.def{color:var(--def)}
.qtext.ex{color:var(--ex)}
.qtext.big{font-size:calc(34px * var(--rs));text-align:center;color:var(--word)}
.qtext input.inl{font:inherit;color:var(--word);background:var(--panel);border:0;border-bottom:2px solid var(--def);border-radius:6px 6px 0 0;padding:2px 6px;width:7.5em;max-width:100%;box-sizing:border-box}
.qtext input.inl:focus{outline:none;border-bottom-color:var(--word)}
.gap{color:var(--word);font-weight:700}
.hint{font:500 15px/1.3 var(--f-ui);color:var(--muted);letter-spacing:.12em;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opts.long{grid-template-columns:1fr}
.opt{font:400 calc(21px * var(--rs))/1.25 var(--f-read);color:var(--text);background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 10px;min-height:62px;cursor:pointer;overflow-wrap:anywhere}
.opts.long .opt{font-size:calc(18px * var(--rs));text-align:left;padding:12px 14px;min-height:52px}
.opt.right{border-color:var(--good);color:var(--good);background:rgba(127,224,160,.08)}
.opt.wrong{border-color:var(--bad);color:var(--bad);background:rgba(255,145,131,.08)}
.listen{display:grid;place-items:center;gap:8px}
.listen .say{width:88px;height:88px}
.listen .say svg{width:40px;height:40px}
textarea.w,input.w{width:100%;box-sizing:border-box;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;color:var(--word);font:400 calc(21px * var(--rs))/1.4 var(--f-read);padding:12px 14px;min-height:54px;resize:none;overflow:hidden}
textarea.w.piece{min-height:180px;overflow:auto;resize:vertical;color:var(--text)}
textarea.w:focus,input.w:focus{border-color:var(--def);outline:none}
.tline{min-height:62px;border:1.5px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tbank{display:flex;flex-wrap:wrap;gap:8px}
.wt{font:400 calc(20px * var(--rs))/1.2 var(--f-read);background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:44px}
.tline .wt{color:var(--word);border-color:#5b2a4c}
.wt[disabled]{visibility:hidden}
.fb{border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:rgba(127,224,160,.1);border:1px solid var(--good)}
.fb.no{background:rgba(255,145,131,.1);border:1px solid var(--bad)}
.fb + .row{margin-top:12px}
.fb h3{margin:0;font:600 19px/1.2 var(--f-ui)}
.fb.ok h3{color:var(--good)}
.fb.no h3{color:var(--bad)}
.fb .ans{font:400 calc(20px * var(--rs))/1.4 var(--f-read);color:var(--ex);margin:0}
.fb .why{margin:0;font-size:15px}
.claude{border-left:3px solid var(--def);padding-left:12px;display:grid;gap:6px}
.claude p{margin:0}
.claude .fix{font:400 calc(19px * var(--rs))/1.45 var(--f-read);color:var(--ex);white-space:pre-wrap}
.sum{text-align:center;display:grid;gap:10px;padding-top:16px}
.sum .big{font:600 56px/1 var(--f-ui);color:var(--word)}
.miss{display:grid;gap:8px;text-align:left}
.miss .m{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:400 calc(17px * var(--rs))/1.4 var(--f-read)}
.miss .m .a{color:var(--ex)}
.compose{display:grid;gap:10px}
.compose textarea{width:100%;box-sizing:border-box;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;color:var(--text);font:400 19px/1.4 var(--f-read);padding:14px;min-height:96px;resize:vertical}
.wc{font:500 13px/1.2 var(--f-ui);color:var(--muted);text-align:right;margin:0}
.wc.ok{color:var(--good)}
/* listening, reading, speaking, timers */
.script{display:grid;gap:8px}
.script p{margin:0;font:400 calc(18px * var(--rs))/1.5 var(--f-read)}
.script b{color:var(--def);font-weight:400}
.passage p{margin:0 0 12px;font:400 calc(18px * var(--rs))/1.6 var(--f-read)}
.passage p:last-child{margin-bottom:0}
.timer{display:grid;gap:10px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.timer .clock{font:600 52px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--word)}
.timer .clock.done{color:var(--gold)}
.timer .lab{font:600 12px/1.2 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.rec{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rec .dotrec{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.cue{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px}
.cue h3{margin:0;font:400 calc(23px * var(--rs))/1.3 var(--f-read);color:var(--word)}
.cue ul{margin:0;padding-left:1.2em;font:400 calc(18px * var(--rs))/1.5 var(--f-read)}
.heard{font:400 calc(18px * var(--rs))/1.4 var(--f-read);color:var(--ex);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;background:var(--panel-2);border:1px solid var(--def);color:var(--text);border-radius:14px;padding:12px 16px;font-weight:500;max-width:min(420px,calc(100% - 32px));box-sizing:border-box;text-align:center}
.confirm{display:grid;gap:10px;border:1px solid var(--bad);border-radius:14px;padding:14px}
.empty{color:var(--muted);text-align:center;padding:20px 10px;margin:0}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);padding-block:8px 6px}
.search input{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--text);font:400 18px/1.2 var(--f-read);padding:13px 14px;min-height:50px}
.loading{color:var(--muted);text-align:center;padding:40px 10px}
@media (min-width:700px){#view{padding-top:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* iPhone Safari paints the text of disabled buttons and inputs grey (-webkit-text-fill-color), which made answered choices look empty: keep their real colour */
button:disabled,input:disabled,textarea:disabled,select:disabled{-webkit-text-fill-color:currentColor}
.opt:disabled{opacity:1;cursor:default}
input:disabled,textarea:disabled{opacity:1}

/* study diary: clickable bars, the month calendar, and review by date or range */
.bars .bar{display:block;background:var(--def);border:0;padding:0;border-radius:4px 4px 0 0;min-height:3px;cursor:pointer;width:100%}
.bars .bar.today{background:var(--word)}
.bars .bar:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.cal{display:grid;gap:10px}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-top b{font:600 16px/1.2 var(--f-ui)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-h{font:600 11px/1 var(--f-ui);color:var(--muted);text-align:center;padding:4px 0;letter-spacing:.06em}
.cal-d{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:500 14px/1 var(--f-ui);cursor:pointer;padding:0;min-width:0}
.cal-d.l1{background:rgba(25,181,174,.22)}
.cal-d.l2{background:rgba(25,181,174,.45)}
.cal-d.l3{background:rgba(25,181,174,.7);color:#001c1a}
.cal-d.l4{background:var(--def);color:#001c1a}
.cal-d.today{outline:2px solid var(--word);outline-offset:1px}
.cal-d.fut{opacity:.35;cursor:default}
.fld{display:grid;gap:6px;min-width:0}
.fld>span{font:600 12px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.din{width:100%;box-sizing:border-box;min-height:44px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;color:var(--text);font:500 16px/1.2 var(--f-ui);padding:8px 10px}
.mode[disabled]{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0}
/* unit pages: goals, steps, key ideas and writing to learn */
.goals .gl{margin:0;padding-left:1.2em;display:grid;gap:6px;font:400 calc(17px * var(--rs))/1.45 var(--f-read)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;font:500 15px/1.35 var(--f-ui)}
.steps .tick{width:26px;height:26px;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;color:#001c1a}
.steps li.done .tick{background:var(--def);border-color:var(--def)}
.steps li.done{color:var(--muted)}
.keys{display:grid;gap:6px}
.keys ul{margin:0;padding-left:1.2em;display:grid;gap:6px;font:400 calc(16px * var(--rs))/1.45 var(--f-read)}
.keys li.mis::marker{color:var(--bad)}
.tip.okc{color:var(--good)}
.tip.noc{color:var(--bad)}
.wstep{gap:10px}
.wstep.locked{opacity:.45}
.wstep .inl{width:100%;box-sizing:border-box;background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;color:var(--text);font:400 19px/1.3 var(--f-read);padding:10px 12px;min-height:48px}
.wstep textarea.w.piece{min-height:84px}
</style>

<script>
(() => {
'use strict';

/* ---------- the library ----------
   Each book is a course file in courses/<id>.json, loaded when the book is opened.
   A course has: about (how the book teaches), secs (section names), units, and optionally order (the study order
   the book recommends), test (a placement test) and modes (the practice types the book uses).
   A unit has: n (its number), s (its section), t (title), sub, L (the left-hand page: explanation blocks),
   W (the words and phrases to learn: "headword|part of speech|meaning|example with [the word]|group|note"),
   X (exercise sets written for the unit), O (Over to you: a writing task) and, for skills units, k with its material. */
const SHELVES = [
  {k:'Vocabulary', c:'#19b5ae'}, {k:'Collocations', c:'#b69cff'}, {k:'Phrasal verbs', c:'#ffa05c'}, {k:'Idioms', c:'#ffd36e'},
  {k:'Pronunciation', c:'#6cc9ff'}, {k:'Grammar', c:'#ff8b8b'}, {k:'IELTS', c:'#7fe0a0'}];
const BOOKS = [
  {id:'evu-e', sh:'Vocabulary', t:'English Vocabulary in Use', lv:'Elementary', cefr:'A1–A2', ab:'E', kind:'vocab', n:60},
  {id:'evu-p', sh:'Vocabulary', t:'English Vocabulary in Use', lv:'Pre-intermediate and Intermediate', cefr:'A2–B1', ab:'PI', kind:'vocab', n:100},
  {id:'evu-u', sh:'Vocabulary', t:'English Vocabulary in Use', lv:'Upper-intermediate', cefr:'B2', ab:'UI', kind:'vocab', n:101},
  {id:'evu-a', sh:'Vocabulary', t:'English Vocabulary in Use', lv:'Advanced', cefr:'C1–C2', ab:'A', kind:'vocab', n:101},
  {id:'avu', sh:'Vocabulary', t:'Academic Vocabulary in Use', lv:'Academic English', cefr:'B2–C1', ab:'AC', kind:'vocab', n:56},
  {id:'col-i', sh:'Collocations', t:'English Collocations in Use', lv:'Intermediate', cefr:'B1–B2', ab:'I', kind:'coll', n:62},
  {id:'col-a', sh:'Collocations', t:'English Collocations in Use', lv:'Advanced', cefr:'C1–C2', ab:'A', kind:'coll', n:60},
  {id:'pv-i', sh:'Phrasal verbs', t:'English Phrasal Verbs in Use', lv:'Intermediate', cefr:'B1–B2', ab:'I', kind:'pv', n:70},
  {id:'pv-a', sh:'Phrasal verbs', t:'English Phrasal Verbs in Use', lv:'Advanced', cefr:'C1–C2', ab:'A', kind:'pv', n:60},
  {id:'idm', sh:'Idioms', t:'English Idioms in Use', lv:'Intermediate', cefr:'B1–B2', ab:'I', kind:'idiom', n:62},
  {id:'pr-e', sh:'Pronunciation', t:'English Pronunciation in Use', lv:'Elementary', cefr:'A1–A2', ab:'E', kind:'pron', n:50},
  {id:'pr-i', sh:'Pronunciation', t:'English Pronunciation in Use', lv:'Intermediate', cefr:'B1–B2', ab:'I', kind:'pron', n:60},
  {id:'egu', sh:'Grammar', t:'English Grammar in Use', lv:'Intermediate', cefr:'B1–B2', ab:'GU', kind:'grammar', n:145},
  {id:'egs', sh:'Grammar', t:'English Grammar in Use', lv:'Supplementary Exercises', cefr:'B1–B2', ab:'SE', kind:'grammar', n:54},
  {id:'ielts', sh:'IELTS', t:'IELTS Preparation', lv:'Listening, Reading, Writing and Speaking', cefr:'Band 5–9', ab:'IE', kind:'ielts', n:0}
];
const READY = new Set(['evu-e', 'evu-p', 'avu']);   // books whose course file is written
const BOOK = new Map(BOOKS.map(b => [b.id, b]));
const shelfColour = b => (SHELVES.find(s => s.k === b.sh) || SHELVES[0]).c;
const bookName = b => b.t + (b.lv && b.kind !== 'ielts' ? ' · ' + b.lv : '');

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'value') n.value = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
}
const put = (n, ...k) => n.replaceChildren(...k.flat(Infinity).filter(x => x != null && x !== false));
const svg = d => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.innerHTML = d; return s; };
const ICON = {
  book:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/><path d="M9 7.5h6"/>',
  phone:'<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3"/>',
  share:'<path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8"/>',
  addsq:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>',
  dots:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  next:'<path d="M9 6l6 6-6 6"/>',
  prev:'<path d="M15 6l-6 6 6 6"/>',
  sound:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  play:'<path d="M7 4.5v15l12-7.5z"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>'
};
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const fmt = n => n.toLocaleString('en-GB');
function DAY(d = new Date()) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
function niceDate(d = new Date()) { return d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'}); }
/* a website copy can name its menu page in window.BW_HOME; Today then shows a way back to it */
const homeLink = () => typeof window.BW_HOME === 'string' && window.BW_HOME ? el('a', {class:'back', href:window.BW_HOME}, svg(ICON.back), 'All apps') : null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2600); }
const escH = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
// course text: **bold**, *highlight* and [word] for the word being taught
const hl = s => escH(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<mark class="h">$1</mark>').replace(/\[(.+?)\]/g, '<span class="tgt">$1</span>');
const plain = s => String(s || '').replace(/\*\*|\*|\[|\]|\{|\}/g, '');
function autosize(ta) { const f = () => { ta.style.height = 'auto'; ta.style.height = Math.max(54, ta.scrollHeight + 2) + 'px'; }; ta.addEventListener('input', f); requestAnimationFrame(f); return ta; }
const noFix = {autocapitalize:'off', autocorrect:'off', spellcheck:'false', autocomplete:'off'};
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const wordCount = t => (String(t).trim().match(/[A-Za-z0-9’']+(?:[-’'][A-Za-z0-9]+)*/g) || []).length;

/* ---------- a British voice (the browser's own speech) ---------- */
const SPEECH = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
let VOICES = [];
function pickVoices() {
  if (!SPEECH) return;
  const all = speechSynthesis.getVoices();
  const gb = all.filter(v => /^en[-_]GB/i.test(v.lang));
  const pref = ['Google UK English Female', 'Google UK English Male', 'Daniel', 'Serena', 'Kate', 'Arthur', 'Martha', 'Stephanie', 'Oliver', 'Microsoft Sonia', 'Microsoft Libby', 'Microsoft Ryan', 'Microsoft Hazel', 'Microsoft George', 'Microsoft Susan'];
  const quality = v => /premium|natural|neural/i.test(v.name) ? 0 : /enhanced|google/i.test(v.name) ? 1 : v.localService === false ? 2 : 3;   // the downloaded high-quality voices first
  const rank = v => { const i = pref.findIndex(p => v.name.startsWith(p)); return i < 0 ? 99 : i; };
  VOICES = gb.slice().sort((a, b) => quality(a) - quality(b) || rank(a) - rank(b));
}
if (SPEECH) { pickVoices(); try { speechSynthesis.addEventListener('voiceschanged', pickVoices); } catch (e) { speechSynthesis.onvoiceschanged = pickVoices; } }
function utter(text, v) {
  const u = new SpeechSynthesisUtterance(plain(text));
  u.lang = 'en-GB'; if (VOICES[v || 0]) u.voice = VOICES[v || 0]; else if (VOICES[0]) u.voice = VOICES[0];
  u.rate = S.set.rate || 0.95;
  return u;
}
function say(text, btn) {
  if (!SPEECH || !text || S.set.voice === false) return;
  speechSynthesis.cancel();
  const u = utter(text);
  if (btn) { btn.classList.add('on'); u.onend = u.onerror = () => btn.classList.remove('on'); }
  speechSynthesis.speak(u);
}
const sayBtn = (text, cls) => SPEECH && S.set.voice !== false ? el('button', {class:'say' + (cls ? ' ' + cls : ''), type:'button', 'aria-label':'Listen', title:'Listen', onclick:e => { e.stopPropagation(); say(text, e.currentTarget); }}, svg(ICON.sound)) : null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

/* ---------- state ---------- */
const APP_ID = 'books';   // the account keeps each app's progress in its own folder
const LS = 'bwbooks-v1';
const DOCS = ['meta', ...BOOKS.map(b => 'b-' + b.id)];   // one part for the settings and the log, one for each book
const blank = () => ({cur:'evu-e', b:{}, stars:{}, notes:{}, log:{}, set:{daily:10, voice:true, rate:0.95, size:'normal'}, ts:{}});

/* accounts on a website copy: config.js names a Firebase project (sign-in plus a Firestore database) */
const FB = (() => {
  const c = window.BW_FIREBASE;
  if ((window.claude && typeof window.claude.use === 'function') || !c || typeof c !== 'object' || !c.apiKey || !c.projectId) return null;
  const e = c.endpoints || {}, pid = String(c.projectId).trim();
  return {key:String(c.apiKey).trim(), project:pid,
    auth:e.auth || 'https://identitytoolkit.googleapis.com/v1', token:e.token || 'https://securetoken.googleapis.com/v1',
    store:(e.store || 'https://firestore.googleapis.com/v1') + '/projects/' + encodeURIComponent(pid) + '/databases/(default)/documents'};
})();
const ACC_KEY = 'bw-account-v1';   // shared by both apps on one site, so one sign-in covers both
let ACC = null;
try { const a = JSON.parse(localStorage.getItem(ACC_KEY) || 'null'); if (FB && a && a.uid && a.rt) ACC = a; } catch (e) {}
function saveAcc() { try { if (ACC) localStorage.setItem(ACC_KEY, JSON.stringify(ACC)); else localStorage.removeItem(ACC_KEY); } catch (e) {} }
/* notebooks: separate sets of progress, each with its own name. Resetting one leaves the others alone.
   On the device each notebook has its own copy. In an account its parts are stored as <notebook>-<part>
   (the first notebook keeps the plain part names), next to a 'notebooks' list. */
const NB_MAIN = 'main';
const baseKey = () => (ACC ? LS + ':' + ACC.uid : LS);   // each account keeps its own copies on the device; LS is for no account
const nbStateKey = (nb, base = baseKey()) => (nb === NB_MAIN ? base : base + ':nb:' + nb);
const docKey = (id, nb = NB) => (nb === NB_MAIN ? id : nb + '-' + id);
function loadNbs(base = baseKey()) {
  try {
    const o = JSON.parse(localStorage.getItem(base + ':notebooks') || 'null');
    if (o && Array.isArray(o.list)) { const list = o.list.filter(x => x && x.id && x.name); if (list.length) return {t:+o.t || 0, list}; }
  } catch (e) {}
  return {t:0, list:[{id:NB_MAIN, name:'My notebook'}]};
}
function loadCur(base = baseKey()) { try { return localStorage.getItem(base + ':notebook') || NB_MAIN; } catch (e) { return NB_MAIN; } }
let NBS = loadNbs(), NB = loadCur();
if (!NBS.list.some(x => x.id === NB)) NB = NBS.list[0].id;
function saveNbs() { try { localStorage.setItem(baseKey() + ':notebooks', JSON.stringify(NBS)); localStorage.setItem(baseKey() + ':notebook', NB); } catch (e) {} }
const nbName = (id = NB) => (NBS.list.find(x => x.id === id) || {name:'My notebook'}).name;
const stateKey = () => nbStateKey(NB);
function loadState(key) {
  let s = blank();
  try { const raw = localStorage.getItem(key); if (raw) { const o = JSON.parse(raw); s = Object.assign(blank(), o); s.set = Object.assign(blank().set, o.set || {}); s.b = o.b || {}; s.ts = o.ts || {}; } }
  catch (e) { /* storage unavailable: start fresh */ }
  return s;
}
let S = loadState(stateKey());

const dirty = new Set();
function saveLocal() { try { localStorage.setItem(stateKey(), JSON.stringify(S)); } catch (e) {} }
function touch(id) { S.ts[id] = Date.now(); dirty.add(id); saveLocal(); scheduleCloud(); }

const cloud = {mode:'connecting', put:null, pull:null, pulled:0, err:''};   // put(id, body) and pull() -> Map(id -> {t, d})
function setSync(m) { cloud.mode = m; if ((TAB === 'me' || TAB === 'today') && !OV.open) render(); }
function trimLog(log) { const keep = DAY() - 150; const o = {}; for (const [k, v] of Object.entries(log)) if (+k >= keep) o[k] = v; return o; }
function docData(id, s = S) {   // s: a notebook's progress (the one in use unless given)
  if (id === 'meta') return {cur:s.cur, stars:s.stars, notes:s.notes, log:trimLog(s.log), set:s.set};
  return s.b[id.slice(2)] || {};
}
function applyDoc(id, d) {
  if (!d) return;
  if (id === 'meta') { S.cur = d.cur || S.cur; S.stars = d.stars || {}; S.notes = d.notes || {}; S.log = d.log || {}; S.set = Object.assign(blank().set, d.set || {}); return; }
  S.b[id.slice(2)] = d;
}
